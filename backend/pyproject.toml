[project]
name = "mirage-backend"
version = "0.1.0"
description = "Mirage API — scam analysis engine, fire drills, live guardian, honeypot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "supabase>=2.6",
    "neo4j>=5.26",
    "groq>=0.13",
    "google-genai>=1.0",
    "edge-tts>=7.0",
    "python-whois>=0.9",
    "python-Levenshtein>=0.26",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "pyotp>=2.9",
]

[project.optional-dependencies]
# Resemblyzer pulls webrtcvad, which has no Python 3.13 wheels on Windows.
# Install with: uv sync --group voice   (use Python 3.11/3.12 if it fails)
voice = ["resemblyzer>=0.1"]

[dependency-groups]
dev = ["ruff>=0.7", "pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
# Run from backend/:  uv run pytest
# pythonpath lets tests import `app` the way uvicorn does.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
