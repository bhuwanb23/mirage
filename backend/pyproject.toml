[project]
name = "mirage-backend"
version = "0.1.0"
description = "Mirage API — scam analysis engine, fire drills, live guardian, honeypot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "supabase>=2.6",
    "neo4j>=5.26",
    "groq>=0.13",
    "google-genai>=1.0",
    "edge-tts>=7.0",
    "python-whois>=0.9",
    "python-Levenshtein>=0.26",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "pyotp>=2.9",
]

[project.optional-dependencies]
# Resemblyzer pulls webrtcvad, which has no Python 3.13 wheels on Windows.
# Install with: uv sync --group voice   (use Python 3.11/3.12 if it fails)
voice = ["resemblyzer>=0.1"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
    "qrcode>=8.2",
]

[tool.pytest.ini_options]
# Run from backend/:  uv run pytest
# pythonpath lets tests import `app` the way uvicorn does.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Dependency-install safety policy.
#
# - Do not run `uv sync` / `uv pip install` with lifecycle scripts enabled in
#   untrusted or automated CI until the dependency set has been reviewed.
# - The first install in a fresh environment should be performed with scripts
#   disabled (or under an equivalent documented fail-closed policy), the pending
#   install scripts inspected, and only the minimum approved.
# - The authoritative lockfile for the backend is `uv.lock`. Keep it committed;
#   do not hand-edit it. Releases must be built from the frozen lockfile, not a
#   freshly resolved graph.
# - Before every release, run the native audit against the committed lockfile and
#   triage critical/high findings by reachability (runtime / build / test /
#   deploy paths). Never auto-apply `uv sync --upgrade` / `uv pip install --upgrade`
#   forced remediation; preview, read the changelog, and test each upgrade.
# - Add new dependencies sparingly. For each new dependency, record ownership,
#   maintenance status, release age, and transitive impact in the PR that adds it.
