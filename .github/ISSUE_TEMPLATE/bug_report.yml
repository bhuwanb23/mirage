name: Bug report
description: Something in Mirage is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, stop and use
        [private reporting](https://github.com/bhuwanb23/mirage/security/advisories/new) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend (Next.js)
        - Backend (FastAPI)
        - Telegram bot
        - ML / voice
        - Deploy / infra
        - Docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, URLs, or inputs that trigger it.
      placeholder: |
        1. Start backend with `uv run uvicorn app.main:app --reload`
        2. POST /analyze/text with {...}
        3. See 500 instead of a verdict
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node/Python versions, deployed on Render vs local"
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
