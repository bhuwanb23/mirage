[project]
name = "mirage-bot"
version = "0.1.0"
description = "Mirage Telegram bot - zero-install scam analysis layer."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv]
package = false
