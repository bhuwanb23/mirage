[project]
name = "mirage-bot"
version = "0.1.0"
description = "Mirage Telegram bot - zero-install scam analysis layer."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "httpx>=0.27",
    "edge-tts>=7.0",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
# Run from bot/:  uv run pytest
# pythonpath lets tests import `handlers`/`utils` as the bot does.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv]
package = false
