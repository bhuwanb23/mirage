# Render blueprint — Mirage (free-tier only)
# Docs: docs/deploy.md
#
# Free compute is only available for web services.
# Background workers require a paid plan — run the Telegram bot locally:
#   cd bot && uv sync && uv run python main.py
#
# After first Blueprint create, Render may suffix hostnames
# (e.g. mirage-api-nj77 / mirage-web-pvgo). Keep NEXT_PUBLIC_API_URL and
# CORS_ORIGINS aligned with the live URLs in the dashboard if they differ.
#
# Minimum secrets for a useful demo on Render (Ollama is local-only):
#   GEMINI_API_KEY or GROQ_API_KEY
# Optional: SUPABASE_URL + SUPABASE_ANON_KEY, NEO4J_URI + NEO4J_PASSWORD

services:
  - type: web
    name: mirage-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: OLLAMA_MODEL
        value: llama3.2:1b
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://mirage-web.onrender.com,https://mirage-web-pvgo.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: mirage-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      # No trailing slash — a trailing slash causes //path URLs and 404s from FastAPI.
      - key: NEXT_PUBLIC_API_URL
        value: https://mirage-api-nj77.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mirage-web-pvgo.onrender.com
