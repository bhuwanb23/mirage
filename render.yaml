# Render blueprint — Mirage (free-tier only)
# Docs: docs/deploy.md
# Provisioning this file does NOT run the SQL/Cypher. Do that first (see docs/deploy.md).
#
# Free compute is only available for web services (and static sites).
# Background workers require a paid plan — run the Telegram bot locally instead:
#   cd bot && uv sync && uv run python main.py
#
# Minimum secrets for a useful Render demo:
#   GEMINI_API_KEY or GROQ_API_KEY, SUPABASE_URL + SUPABASE_ANON_KEY (optional),
#   NEO4J_URI + NEO4J_PASSWORD (optional — SQLite graph fallback otherwise)

services:
  - type: web
    name: mirage-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Soft-init: missing keys warn/log but do not crash boot.
      # Flip to production in the dashboard once secrets are filled.
      - key: ENVIRONMENT
        value: development
      - key: OLLAMA_MODEL
        value: llama3.2:1b
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://mirage-web.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: mirage-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mirage-api.onrender.com
